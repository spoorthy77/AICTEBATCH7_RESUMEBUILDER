global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    # Add webhook or email receiver here

  - name: 'critical'
    # Send critical alerts immediately
    webhook_configs:
      - url: 'http://alert-handler:5000/alert'
        send_resolved: true

  - name: 'warning'
    # Send warning alerts with less frequency
    webhook_configs:
      - url: 'http://alert-handler:5000/alert'
        send_resolved: true

