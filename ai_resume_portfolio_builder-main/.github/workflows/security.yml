name: Enhanced Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner (Filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs.sarif'

    - name: Run Trivy vulnerability scanner (Config)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-config.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-fs.sarif'

    - name: Run Bandit security linter (Python)
      run: |
        pip install bandit
        bandit -r backend/ -f json -o bandit-results.json || true
      continue-on-error: true

    - name: Check for exposed secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'AI Resume Portfolio Builder'
        path: '.'
        format: 'JSON'
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        pip install pylint flake8 black isort

    - name: Check code formatting with Black
      run: black --check backend/ || true
      continue-on-error: true

    - name: Check import sorting with isort
      run: isort --check-only backend/ || true
      continue-on-error: true

    - name: Lint with pylint
      run: |
        pylint backend/ --exit-zero || true
      continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check for outdated Python dependencies
      run: |
        pip install pip-audit
        pip-audit || true
      continue-on-error: true

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Check for outdated npm packages
      working-directory: ./frontend
      run: npm audit || true
      continue-on-error: true

  license-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check licenses
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
      continue-on-error: true
