apiVersion: v1
kind: Service
metadata:
  name: resume-app-service
  namespace: resume-builder
spec:
  type: LoadBalancer
  selector:
    app: resume-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: resume-builder
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resume-builder
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
