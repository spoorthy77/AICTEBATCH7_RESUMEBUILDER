apiVersion: v1
kind: Namespace
metadata:
  name: resume-builder
  labels:
    name: resume-builder

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: resume-builder
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: resume-builder
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production"
  GROK_API_KEY: "your-key"
  OPENAI_API_KEY: "your-key"
  DATABASE_URL: "postgresql://admin:password@postgres:5432/resume_builder"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-data-pv
  namespace: resume-builder
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: "/data/app"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-pvc
  namespace: resume-builder
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
