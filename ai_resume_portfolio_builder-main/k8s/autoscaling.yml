apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-app-hpa
  namespace: resume-builder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: resume-app-pdb
  namespace: resume-builder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: resume-app
